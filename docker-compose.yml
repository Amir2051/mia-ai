services:
  mia-ai:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - mia-data:/app/data
    restart: unless-stopped
    networks:
      default:
      supabase_network_safenestt-platform:
        aliases:
          - db
volumes:
  mia-data:

networks:
  supabase_network_safenestt-platform:
    external: true
