name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mia
          POSTGRES_PASSWORD: mia
          POSTGRES_DB: mia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mia -d mia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret
      # Model the production split: the app connects as the restricted runtime
      # role while Alembic uses a separate migration/admin connection.
      DATABASE_URL: postgresql+asyncpg://mia_runtime_test:mia-rls-ci-only@127.0.0.1:5432/mia_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://mia:mia@127.0.0.1:5432/mia_test
      MIA_RLS_TEST_ADMIN_URL: postgresql+asyncpg://mia:mia@127.0.0.1:5432/mia_test
      MIA_RLS_TEST_RUNTIME_URL: postgresql+asyncpg://mia_runtime_test:mia-rls-ci-only@127.0.0.1:5432/mia_test
      SHOPIFY_API_KEY: ci-key
      SHOPIFY_API_SECRET: ci-secret
      SHOPIFY_APP_URL: https://mia.drivenest.info
      CORS_ORIGINS: https://mia.drivenest.info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Generate ephemeral test encryption key
        run: python -c "from cryptography.fernet import Fernet; print('TOKEN_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
      - name: Create restricted PostgreSQL RLS test role
        env:
          PGPASSWORD: mia
        run: |
          psql -h 127.0.0.1 -U mia -d mia_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE mia_runtime_test LOGIN PASSWORD 'mia-rls-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT ON DATABASE mia_test TO mia_runtime_test;
          GRANT USAGE ON SCHEMA public TO mia_runtime_test;
          SQL
      - name: Run database migrations using the admin connection
        run: alembic -c alembic.ini upgrade head
      - name: Grant minimum table permissions to restricted test role
        env:
          PGPASSWORD: mia
        run: |
          psql -h 127.0.0.1 -U mia -d mia_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE shops TO mia_runtime_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE shop_sessions TO mia_runtime_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE product_imports TO mia_runtime_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE sync_jobs TO mia_runtime_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE app_settings TO mia_runtime_test;
          GRANT SELECT, INSERT ON TABLE audit_logs TO mia_runtime_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE webhook_events TO mia_runtime_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE scheduled_reports TO mia_runtime_test;
          GRANT SELECT, INSERT, UPDATE ON TABLE mia_memory TO mia_runtime_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE social_accounts TO mia_runtime_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE publishing_actions TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE shops_id_seq TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE shop_sessions_id_seq TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE product_imports_id_seq TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE sync_jobs_id_seq TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE app_settings_id_seq TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE mia_memory_id_seq TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE social_accounts_id_seq TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE webhook_events_id_seq TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE scheduled_reports_id_seq TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE publishing_actions_id_seq TO mia_runtime_test;
          GRANT USAGE, SELECT ON SEQUENCE audit_logs_id_seq TO mia_runtime_test;
          DO $$
          BEGIN
            IF NOT has_function_privilege(
              'mia_runtime_test',
              'public.mia_purge_audit_logs_for_privacy(bigint,text,text,boolean)',
              'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'migration did not grant the GDPR purge function to the runtime role';
            END IF;
          END
          $$;
          SQL
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=moderate

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag mia-ai:ci .
