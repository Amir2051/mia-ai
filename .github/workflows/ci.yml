name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mia
          POSTGRES_PASSWORD: mia
          POSTGRES_DB: mia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mia -d mia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgresql+asyncpg://mia:mia@127.0.0.1:5432/mia_test
      SHOPIFY_API_KEY: ci-key
      SHOPIFY_API_SECRET: ci-secret
      SHOPIFY_APP_URL: https://drivenest.info
      CORS_ORIGINS: https://drivenest.info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Generate ephemeral test encryption key
        run: python -c "from cryptography.fernet import Fernet; print('TOKEN_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
      - run: alembic -c alembic.ini upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=moderate

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag mia-ai:ci .
