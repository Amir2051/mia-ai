name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      SHOPIFY_API_KEY: ci-key
      SHOPIFY_API_SECRET: ci-secret
      SHOPIFY_APP_URL: https://drivenest.info
      SHOPIFY_REDIRECT_URIS: https://drivenest.info/auth/callback
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
      CORS_ORIGINS: https://drivenest.info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: alembic -c alembic.ini upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
