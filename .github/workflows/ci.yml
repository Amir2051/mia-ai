name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/mia_test
      POSTGRES_ADMIN_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/mia_test
      POSTGRES_RLS_TEST_URL: postgresql+asyncpg://mia_rls_test:mia_rls_test@127.0.0.1:5432/mia_test
      SHOPIFY_API_KEY: ci-key
      SHOPIFY_API_SECRET: ci-secret
      SHOPIFY_APP_URL: https://drivenest.info
      CORS_ORIGINS: https://drivenest.info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Generate ephemeral test encryption key
        run: python -c "from cryptography.fernet import Fernet; print('TOKEN_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
      - name: Run migrations against PostgreSQL
        run: alembic -c alembic.ini upgrade head
      - name: Prepare PostgreSQL RLS test role
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d mia_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'mia_rls_test') THEN
              ALTER ROLE mia_rls_test WITH LOGIN PASSWORD 'mia_rls_test';
            ELSE
              CREATE ROLE mia_rls_test LOGIN PASSWORD 'mia_rls_test';
            END IF;
          END $$;
          GRANT USAGE ON SCHEMA public TO mia_rls_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO mia_rls_test;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO mia_rls_test;
          SQL
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=moderate

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --build-arg BUILD_ID=${{ github.sha }} --tag mia-ai:ci .
